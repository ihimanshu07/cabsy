<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact CABSY</title><meta name="description" content="Contact CABSY about a booking request."><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/pages.css"></head><body><header class="site-header"><nav class="nav container"><a class="logo" href="index.html">CAB<span>SY</span></a><div class="nav-links"><a href="index.html">Home</a><a href="fares.html">Fares</a><a href="services.html">Services</a><a class="active" href="contact.html">Contact</a></div><div class="nav-actions" data-auth-slot></div></nav></header><main class="content-page container"><div class="contact-layout"><aside class="contact-aside"><span class="eyebrow">Get in touch</span><h1>Contact CABSY</h1><p>Send a message about an existing request or a general question. Please do not include passwords or other sensitive personal information.</p><p><strong>Business contact details</strong><br>To be supplied before production launch.</p></aside><form id="contact-form" class="card contact-form"><h2>Send a message</h2><div class="form-grid-2"><div class="field"><label for="contact-name">Name</label><input id="contact-name" name="name" required></div><div class="field"><label for="contact-email">Email</label><input id="contact-email" name="email" type="email" required></div></div><div class="field"><label for="contact-phone">Phone <small>(optional)</small></label><input id="contact-phone" name="phone" inputmode="tel"></div><div class="field"><label for="contact-message">Message</label><textarea id="contact-message" name="message" required minlength="10"></textarea></div><button class="button" type="submit">Send message</button></form></div></main><div class="toast-region" aria-live="polite"></div><script type="module" src="js/contact.js"></script></body></html>
