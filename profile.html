<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Profile | CABSY</title><meta name="description" content="Manage your CABSY profile."><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/profile.css"></head><body><header class="site-header"><nav class="nav container"><a class="logo" href="index.html">CAB<span>SY</span></a><div class="nav-links"><a href="index.html">Home</a><a href="bookings.html">My Bookings</a></div><div class="nav-actions" data-auth-slot></div></nav></header><main class="dashboard container"><div class="dashboard-head"><div><span class="eyebrow">My account</span><h1>Profile</h1></div></div><div class="profile-layout"><aside class="card profile-side"><div class="avatar" id="avatar">—</div><h2 id="profile-name">Loading...</h2><p id="profile-email"></p><p>Member since <span id="profile-created">—</span></p></aside><form id="profile-form" class="card profile-form"><h2>Your details</h2><p>Keep your name and phone number current for upcoming booking requests.</p><div class="form-grid-2"><div class="field"><label for="full_name">Full name</label><input id="full_name" name="full_name" autocomplete="name" required></div><div class="field"><label for="phone">Phone number</label><input id="phone" name="phone" autocomplete="tel" inputmode="tel" required></div></div><p class="auth-note">To change your email address, use Supabase’s secure email-change flow when it is enabled for your project.</p><button class="button" type="submit">Save profile</button></form></div></main><div class="toast-region" aria-live="polite"></div><script type="module" src="js/profile.js"></script></body></html>
